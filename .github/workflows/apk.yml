name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate the project
        run: |
          if [ ! -f package.json ] && ls ./*.zip >/dev/null 2>&1; then
            for z in ./*.zip; do unzip -oq "$z"; done
          fi
          PKG=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | awk '{print length($0), $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$PKG" ]; then
            echo "::error::No package.json found in the repo. Upload the project files, not only a .zip."
            exit 1
          fi
          echo "APP_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"
          echo "Project found in: $(dirname "$PKG")"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npx expo install react react-native expo-constants expo-linking expo-status-bar react-native-safe-area-context react-native-screens
          npm install --save-dev typescript @types/react
          npx expo install --fix

      - name: Generate native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-apk-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
